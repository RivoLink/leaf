[package]
name = "leaf-markdown-viewer"
version = "1.29.2"
edition = "2021"
description = "Terminal Markdown previewer with a GUI-like experience"
license = "MIT"
repository = "https://github.com/RivoLink/leaf"
homepage = "https://leaf.rivolink.mg"
readme = "README.md"
keywords = ["markdown", "terminal", "viewer", "tui", "cli"]
categories = ["command-line-utilities", "text-processing"]
authors = ["RivoLink <rivo.link@gmail.com>"]

[[bin]]
name = "leaf"
path = "src/main.rs"

[dependencies]
ratatui       = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm     = "0.29"
pulldown-cmark = "0.12"
syntect       = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
anyhow        = "1.0"
unicode-width = "0.2"
unicode-segmentation = "1"
ureq          = { version = "3", default-features = false, features = ["rustls", "json"] }
serde         = { version = "1.0", features = ["derive"] }
semver        = "1.0"
sha2          = "0.10"
toml          = "0.8"
unicodeit     = "0.2"
mmdflux       = { version = "2.5", default-features = false }
fs2           = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
crossterm     = { version = "0.29", features = ["use-dev-tty"] }

[target.'cfg(unix)'.dependencies]
nix           = { version = "0.29", features = ["signal"] }
